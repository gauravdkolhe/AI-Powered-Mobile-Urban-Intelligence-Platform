services:
  - type: web
    name: margadrishti-api
    env: python
    region: oregon
    plan: free
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'uvicorn backend.main:app --host 0.0.0.0 --port '
    envVars:
      - key: PORT
        value: 10000

  - type: static
    name: margadrishti-web
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: 'npm install && npm run build'
    staticPublishPath: dist
